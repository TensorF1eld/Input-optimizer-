plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = '1.0.6-optimized+mc1.21.11'
group = 'dev.kemmlow'

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"
    // Dawn's Fabric Loader already supplies MixinExtras at runtime.
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

base {
    archivesName = 'inputoptimizer'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:deprecation')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

sourceSets {
    inputOrderTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.register('orderedInputTest', JavaExec) {
    dependsOn tasks.named('inputOrderTestClasses')
    classpath = sourceSets.inputOrderTest.runtimeClasspath
    mainClass = 'dev.kemmlow.inputoptimizer.rawinput.OrderedInputChecks'
}

tasks.register('chatOpeningTest', JavaExec) {
    dependsOn tasks.named('inputOrderTestClasses')
    classpath = sourceSets.inputOrderTest.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.kemmlow.inputoptimizer.ChatOpeningChecks'
}

tasks.named('check') {
    dependsOn tasks.named('orderedInputTest')
    dependsOn tasks.named('chatOpeningTest')
    dependsOn tasks.named('inputFeatureTest')
}

tasks.register('inputFeatureTest', JavaExec) {
    dependsOn tasks.named('inputOrderTestClasses')
    classpath = sourceSets.inputOrderTest.runtimeClasspath
    mainClass = 'dev.kemmlow.inputoptimizer.rawinput.InputFeatureChecks'
}
